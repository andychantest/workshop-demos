<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trip Planner｜班級旅行企劃</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Karla:ital,wght@0,400;0,700;1,400&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
/* ============ 設計系統 ============ */
:root{
  --paper:#f6efe1; --board:#f1e9d7; --card:#fffdf5;
  --ink:#3a3730; --muted:#8b8474; --faint:#b7ae99;
  --line:#e3d9c2; --washi:rgba(255,255,255,.5);
  --yellow:#ffe9a8; --pink:#ffd0cd; --mint:#cfe8c9; --sky:#c6e2f2; --lav:#ded1f0;
  --coral:#ff7a59; --corald:#e86240; --teal:#2e8b8b;
  --shadow:0 2px 6px rgba(90,75,40,.14), 0 10px 22px rgba(90,75,40,.10);
  --f-h: 'Caveat', 'Segoe Script', cursive;
  --f-n: 'Patrick Hand', 'Segoe Script', cursive;
  --f-b: 'Karla', system-ui, sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:var(--f-b); color:var(--ink);
  background:
    radial-gradient(circle, rgba(90,75,40,.06) 1px, transparent 1.5px) 0 0/22px 22px,
    var(--paper);
  min-height:100vh;
  display:flex; flex-direction:column;
  overflow:hidden;
}

/* ============ Topbar ============ */
.topbar{
  display:flex; align-items:center; gap:12px;
  padding:10px 18px;
  background:var(--board);
  border-bottom:2px dashed var(--line);
  flex-wrap:wrap; z-index:20;
}
.brand{display:flex; align-items:center; gap:10px; margin-right:6px;}
.brand .logo{
  width:38px;height:38px;border-radius:10px;background:var(--coral);
  display:grid;place-items:center;transform:rotate(-3deg);box-shadow:var(--shadow);
}
.brand h1{font-family:var(--f-h); font-size:28px; line-height:1; font-weight:700;}
.brand small{display:block; font-family:var(--f-b); font-size:11px; color:var(--muted); letter-spacing:.4px;}
.spacer{flex:1;}
.tools{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}

.btn{
  font-family:var(--f-b); font-size:13px; font-weight:700;
  border:none; cursor:pointer; border-radius:10px; padding:8px 12px;
  background:var(--card); color:var(--ink);
  border:1.5px solid var(--line); box-shadow:0 1px 2px rgba(0,0,0,.05);
  transition:transform .12s, box-shadow .12s, background .12s;
}
.btn:hover{transform:translateY(-1px) rotate(-.3deg); box-shadow:var(--shadow);}
.btn:active{transform:translateY(0);}
.btn.coral{background:var(--coral); color:#fff; border-color:transparent;}
.btn.ghost{background:transparent; border-color:var(--line);}
.btn.sm{padding:5px 9px; font-size:12px; border-radius:8px;}

.lang{position:relative;}
.lang select{
  font-family:var(--f-b); font-size:13px; font-weight:700;
  border:1.5px solid var(--line); background:var(--card); color:var(--ink);
  border-radius:10px; padding:8px 10px; cursor:pointer; outline:none;
}

/* ============ Stage ============ */
.stage{flex:1; display:flex; min-height:0;}

/* ---- 檢查清單側欄 ---- */
.checklist{
  width:250px; flex:0 0 250px; overflow-y:auto;
  padding:16px 14px; border-right:2px dashed var(--line);
  background:linear-gradient(rgba(255,255,255,.35), rgba(255,255,255,.08));
}
.cl-head{display:flex; align-items:center; gap:12px; margin-bottom:6px;}
.ring{position:relative; width:74px; height:74px;}
.ring svg{width:74px; height:74px; transform:rotate(-90deg);}
.ring .bg{fill:none; stroke:var(--line); stroke-width:7;}
.ring .fg{fill:none; stroke:var(--teal); stroke-width:7; stroke-linecap:round;
  transition:stroke-dashoffset .6s cubic-bezier(.6,0,.3,1);}
.ring .num{position:absolute; inset:0; display:grid; place-items:center;
  font-family:var(--f-h); font-weight:700; font-size:24px; color:var(--deep);}
.cl-title{font-family:var(--f-h); font-size:26px; line-height:1; font-weight:700;}
.cl-sub{font-size:12px; color:var(--muted); margin-bottom:12px;}
.cl-items{display:flex; flex-direction:column; gap:9px;}
.cl-item{
  display:flex; gap:9px; align-items:flex-start;
  background:var(--card); border:1.5px solid var(--line); border-radius:11px;
  padding:9px 10px; font-size:13px; line-height:1.35;
  opacity:.55; filter:saturate(.4); transition:opacity .3s, filter .3s, transform .3s;
}
.cl-item.done{opacity:1; filter:saturate(1); transform:rotate(-.4deg);}
.cl-check{
  width:20px;height:20px;flex:0 0 20px;border-radius:6px;border:2px dashed var(--faint);
  display:grid;place-items:center;font-size:13px;color:transparent;margin-top:1px;
}
.cl-item.done .cl-check{border-style:solid;border-color:var(--teal);background:var(--mint);color:var(--teal);}
.cl-desc{font-size:11px; color:var(--muted); margin-top:10px; line-height:1.5;}
.badge-ready{
  display:none;margin-top:10px;text-align:center;font-family:var(--f-n);font-size:16px;
  background:var(--mint); border:2px dashed var(--teal); color:var(--teal);
  border-radius:12px; padding:8px 6px; transform:rotate(-1deg);
}
.badge-ready.show{display:block; animation:pop .4s;}
.badge-ready button{margin-top:7px;}

/* ---- 白板 ---- */
.board{
  flex:1; overflow-x:auto; overflow-y:hidden; padding:18px 20px 26px;
  background:
    radial-gradient(circle, rgba(90,75,40,.05) 1px, transparent 1.5px) 0 0/26px 26px,
    transparent;
}
.board-inner{display:flex; gap:18px; align-items:flex-start; width:max-content; min-width:100%; padding-bottom:8px;}
.board-title{
  font-family:var(--f-h); font-size:40px; font-weight:700; line-height:1;
  margin:2px 4px 16px; width:max-content; min-width:180px; outline:none;
  border-bottom:2px dashed transparent; cursor:text;
}
.board-title:hover{border-bottom-color:var(--faint);}
.board-title:focus{border-bottom-color:var(--coral);}
.board-title:empty:before{content:attr(data-ph); color:var(--faint);}

/* ---- 欄位 panels ---- */
.col{
  width:290px; flex:0 0 290px;
  background:var(--card); border-radius:18px; box-shadow:var(--shadow);
  border:1.5px solid var(--line); padding:12px 11px 14px;
  display:flex; flex-direction:column; max-height:calc(100vh - 160px);
  animation:rise .5s both;
}
.col:nth-child(2){animation-delay:.05s}.col:nth-child(3){animation-delay:.1s}
.col:nth-child(4){animation-delay:.15s}.col:nth-child(5){animation-delay:.2s}
.col:nth-child(6){animation-delay:.25s}.col:nth-child(7){animation-delay:.3s}

.col-head{display:flex; align-items:center; gap:8px; padding:2px 2px 9px; position:relative;}
.col-head .was{
  position:absolute; top:-12px; left:-3px; width:70%; height:16px;
  background:repeating-linear-gradient(45deg, rgba(255,255,255,.7) 0 6px, rgba(255,255,255,.35) 6px 12px);
  border-radius:3px; transform:rotate(-1.5deg); opacity:.85; pointer-events:none;
}
.col-head .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:0 0 30px;color:#fff;}
.col-head h2{font-family:var(--f-h); font-size:24px; font-weight:700; line-height:1;}
.col-head .count{font-family:var(--f-n); font-size:14px; color:var(--muted);
  background:var(--board); border-radius:20px; padding:2px 9px;}
.col-body{overflow-y:auto; overflow-x:hidden; flex:1; display:flex; flex-direction:column; gap:12px; padding:6px 2px 4px;}

.ic-plane{background:#6aa8d6}.ic-bus{background:#7fb57f}.ic-bowl{background:#ee9aa4}.ic-wallet{background:#b68ad0}
.ic-team{background:#58a8a0}.ic-clock{background:#c99a5b}

/* ---- 便利貼卡片 ---- */
.note{
  position:relative; border-radius:4px 14px 14px 14px; padding:16px 12px 10px;
  box-shadow:var(--shadow); cursor:grab; transition:transform .15s, box-shadow .15s;
  animation:pop .35s both;
}
.note:hover{transform:rotate(-1deg) translateY(-2px) scale(1.01); box-shadow:0 6px 16px rgba(90,75,40,.22);}
.note.dragging{opacity:.45;}
.note::before{
  content:""; position:absolute; top:-10px; left:50%; margin-left:-36px;
  width:72px; height:16px; background:var(--washi); border-radius:2px;
  border:1px solid rgba(255,255,255,.55); transform:rotate(-1.6deg);
}
.note .nt{
  font-family:var(--f-n); font-size:18px; line-height:1.35; outline:none;
  min-height:26px; word-break:break-word;
}
.note .nt:empty:before{content:attr(data-ph); color:var(--faint);}
.note-foot{display:flex; align-items:center; gap:6px; margin-top:7px; min-height:22px;}
.note-foot .sq{width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,.35);}
.mini{
  font-family:var(--f-b); font-size:11px; background:rgba(255,255,255,.55);
  border:1px dashed rgba(0,0,0,.12); color:var(--muted); border-radius:6px; padding:2px 6px;
}
.del{
  margin-left:auto; width:22px; height:22px; flex:0 0 22px; border:none; cursor:pointer; border-radius:50%;
  background:transparent; color:var(--faint); font-size:15px; line-height:1;
  transition:background .15s, color .15s;
}
.note:hover .del{color:var(--muted);}
.del:hover{background:var(--pink); color:var(--corald);}
.note .heart{
  border:none; cursor:pointer; background:transparent; color:#c96f6a;
  font-family:var(--f-n); font-size:15px; padding:0 2px; line-height:1;
  transform:translateY(-1px); transition:transform .12s;
}
.note .heart:hover{transform:scale(1.25);}
.seal{
  margin-left:auto; font-family:var(--f-n); font-size:12px; color:var(--teal);
  background:var(--mint); border:1px dashed var(--teal); border-radius:6px; padding:1px 6px;
}
.note-y{background:var(--yellow); transform:rotate(.5deg);}
.note-p{background:var(--pink); transform:rotate(-.7deg);}
.note-m{background:var(--mint); transform:rotate(.8deg);}
.note-s{background:var(--sky); transform:rotate(-.5deg);}
.note-v{background:var(--lav); transform:rotate(-.8deg);}
.note-o{background:#ffe2c2; transform:rotate(.6deg);}

/* ---- 交通卡特殊 ---- */
.trans-row{padding:0 2px;}
.trans-card{
  display:flex; gap:8px; align-items:center; background:var(--card);
  border:1.5px solid var(--line); border-radius:12px; padding:8px 10px; margin-bottom:8px;
  box-shadow:0 1px 3px rgba(0,0,0,.06); cursor:grab;
}
.trans-card .nt{font-family:var(--f-b); font-size:13px;}
.badge{font-family:var(--f-b); font-size:11px; color:#fff; border-radius:6px; padding:2px 7px; flex:0 0 auto;}

/* ---- 成員與任務 ---- */
.tags{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:8px; padding:8px; background:var(--board); border-radius:12px;}
.tag{
  display:inline-flex; align-items:center; gap:5px; font-family:var(--f-n); font-size:15px;
  color:#fff; padding:3px 9px 3px 11px; border-radius:20px; cursor:grab;
  box-shadow:0 1px 3px rgba(0,0,0,.18); user-select:none;
}
.tag .kill{background:rgba(0,0,0,.18); border-radius:50%; width:15px;height:15px;font-size:11px;line-height:15px;text-align:center;cursor:pointer;}
.addrow{display:flex; gap:6px; margin-bottom:10px;}
.addrow input{
  flex:1; font-family:var(--f-b); font-size:13px; padding:7px 9px; border-radius:9px;
  border:1.5px solid var(--line); background:var(--card); color:var(--ink); outline:none; min-width:0;
}
.addrow input:focus{border-color:var(--coral);}
.task{
  position:relative; background:var(--card); border:1.5px solid var(--line); border-radius:13px;
  padding:9px 10px 8px; box-shadow:0 1px 3px rgba(0,0,0,.06);
}
.task .nt{font-family:var(--f-b); font-size:13px; line-height:1.3; outline:none; min-height:20px;}
.task .nt:empty:before{content:attr(data-ph); color:var(--faint);}
.task-foot{display:flex; align-items:center; gap:6px; margin-top:7px;}
.mini-assign{
  flex:0 0 auto; font-family:var(--f-b); font-size:11px; color:var(--muted);
  border:1.5px dashed var(--line); border-radius:7px; padding:2px 7px; cursor:default;
}
.mini-assign.ok{background:var(--mint); border-style:solid; border-color:var(--teal); color:var(--teal);}
.task.drag-over{outline:3px dashed var(--coral); outline-offset:2px; background:#fff4ee;}

/* ---- 預算 ---- */
.budget-row{display:flex; align-items:center; gap:6px;}
.budget-row input[type=text]{
  flex:1; font-family:var(--f-b); font-size:13px; padding:7px 9px; border-radius:9px;
  border:1.5px solid var(--line); background:var(--card); outline:none; min-width:0;
}
.budget-row input[type=number]{
  width:78px; font-family:var(--f-b); font-size:13px; padding:7px 8px; border-radius:9px;
  border:1.5px solid var(--line); background:var(--card); outline:none; text-align:right;
}
.budget-row input:focus{border-color:var(--coral);}
.budget-sum{ margin-top:9px; padding:10px; background:var(--board); border-radius:12px; }
.budget-sum .l{font-size:11px; color:var(--muted);}
.budget-sum .big{font-family:var(--f-h); font-size:30px; font-weight:700; color:var(--deep); line-height:1.1;}
.budget-sum .per{font-family:var(--f-b); font-size:13px; color:var(--teal); font-weight:700;}

/* ---- 時間軸 ---- */
.tl-slot{
  background:var(--card); border:1.5px dashed var(--line); border-radius:13px;
  padding:8px 9px; transition:background .15s, outline .15s;
}
.tl-slot.drag-over{outline:3px dashed var(--corald); outline-offset:2px; background:#fff7ef;}
.tl-row{display:flex; gap:7px; align-items:center; margin-bottom:6px;}
.tl-row .t{
  width:72px; flex:0 0 72px; font-family:var(--f-n); font-size:16px; text-align:center;
  border-radius:8px; border:1.5px solid var(--line); padding:4px 2px; outline:none; color:var(--deep);
}
.tl-text{font-family:var(--f-n); font-size:17px; line-height:1.3; min-height:22px; outline:none; word-break:break-word;}
.tl-text:empty:before{content:attr(data-ph); color:var(--faint);}
.tl-note{display:none; font-family:var(--f-b); font-size:11px; color:var(--teal); margin:1px 2px 2px;}
.tl-note.show{display:block;}

.col-add{
  margin-left:auto; width:27px; height:27px; border-radius:50%;
  border:2px dashed var(--faint); background:var(--card); color:var(--muted);
  font-family:var(--f-b); font-size:16px; font-weight:700; line-height:1;
  display:grid; place-items:center; cursor:pointer;
  transition:all .15s; transform:rotate(0deg);
}
.col-add:hover{border-color:var(--coral); color:var(--corald); background:rgba(255,122,89,.1); transform:rotate(90deg);}

/* ---- 模態框 ---- */
.veil{
  position:fixed; inset:0; background:rgba(58,55,48,.45); backdrop-filter:blur(3px);
  display:none; place-items:center; z-index:100; padding:20px;
}
.veil.open{display:grid; animation:fade .25s;}
.paper-card{
  width:min(560px, 94vw); max-height:88vh; overflow-y:auto;
  background:var(--card); border-radius:22px; box-shadow:0 24px 60px rgba(0,0,0,.35);
  padding:26px 26px 24px; position:relative; transform:rotate(-.4deg);
  border:2px solid var(--line); animation:cardin .35s cubic-bezier(.5,1.6,.4,1);
}
.paper-card .ribbon{position:absolute; top:-14px; left:50%; transform:translateX(-50%) rotate(-2deg);}
.paper-card h2{font-family:var(--f-h); font-size:38px; font-weight:700; text-align:center; line-height:1.05;}
.paper-card .sub{text-align:center; color:var(--muted); font-size:14px; margin:4px 0 18px;}

.showcase{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:14px 0;}
.showcase .cell{background:var(--board); border-radius:13px; padding:11px; text-align:center;}
.showcase .cell b{display:block; font-family:var(--f-h); font-size:26px; font-weight:700; color:var(--deep);}
.showcase .cell span{font-size:11px; color:var(--muted);}
.itin{
  background:linear-gradient(rgba(201,229,242,.5), rgba(201,229,242,.15));
  border:1.5px dashed #8fb6cd; border-radius:14px; padding:12px 14px; margin:12px 0; list-style:none;
}
.itin li{font-family:var(--f-n); font-size:17px; padding:4px 0; border-bottom:1px dashed rgba(0,0,0,.08); display:flex; gap:9px;}
.itin li:last-child{border-bottom:none;}
.itin .t{color:var(--teal); font-weight:700;}
.actions{display:flex; gap:10px; justify-content:center; margin-top:16px;}

/* ---- 說明指南 ---- */
.help{ width:min(680px, 94vw); }
.help h2{margin-bottom:2px;}
.help .doc{color:var(--ink); font-size:14px; line-height:1.65;}
.help h3{font-family:var(--f-h); font-size:24px; margin:18px 0 4px; color:var(--corald);}
.help h4{font-size:14px; margin:12px 0 2px; color:var(--teal);}
.help p{margin:6px 0;}
.help ul{margin:4px 0 4px 20px;}
.help li{margin:3px 0;}
.help code{background:var(--board); border:1px solid var(--line); border-radius:5px; padding:0 5px; font-size:12px;}
.help .kv{display:flex; gap:10px; flex-wrap:wrap; margin:8px 0;}
.help .kv b{min-width:92px; color:var(--deep);}

/* ---- 彩帶 ---- */
.confetti{position:fixed; top:-14px; z-index:400; pointer-events:none; animation:fall linear forwards; opacity:.95;}
@keyframes fall{to{transform:translateY(108vh) rotate(720deg); opacity:.2;}}
@keyframes pop{from{transform:scale(.6); opacity:0;} to{transform:scale(1); opacity:1;}}
@keyframes rise{from{transform:translateY(16px); opacity:0;} to{transform:none; opacity:1;}}
@keyframes fade{from{opacity:0;} to{opacity:1;}}
@keyframes cardin{from{transform:scale(.82) rotate(-3deg); opacity:0;} to{transform:none; opacity:1;}}

.paper-card.confirm{width:min(420px,92vw); text-align:center;}
.paper-card.confirm h2{font-family:var(--f-b); font-size:18px; font-weight:700; line-height:1.5; color:var(--ink); margin:4px 0 18px;}

@media (max-width:820px){
  .stage{flex-direction:column; overflow:hidden;}
  .checklist{width:auto; flex:none; border-right:none; border-bottom:2px dashed var(--line); max-height:38vh;}
  .board{overflow-y:auto;}
  body{overflow:auto;}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 12l20-8-6 18-4-6-10-4z"/><path d="M12 16L20 4"/>
      </svg>
    </div>
    <div>
      <h1 data-i18n="brand.title">Trip Planner</h1>
      <small data-i18n="brand.sub">Class trip planning board</small>
    </div>
  </div>

  <div class="spacer"></div>
  <div class="tools">
    <span class="lang">
      <select id="langSel" aria-label="Language">
        <option value="zh-TW">繁體中文</option>
        <option value="zh-CN">简体中文</option>
        <option value="en">English</option>
      </select>
    </span>
    <button class="btn ghost sm" id="btnExample" data-i18n="tool.example">Load example</button>
    <button class="btn ghost sm" id="btnReset" data-i18n="tool.reset">Reset</button>
    <button class="btn coral sm" id="btnHelp">?</button>
  </div>
</header>

<div class="stage">
  <aside class="checklist">
    <div class="cl-head">
      <div class="ring">
        <svg viewBox="0 0 74 74">
          <circle class="bg" cx="37" cy="37" r="31"></circle>
          <circle class="fg" cx="37" cy="37" r="31"></circle>
        </svg>
        <div class="num" id="ringNum">0%</div>
      </div>
      <div>
        <div class="cl-title" data-i18n="cl.title">Trip Kit</div>
        <div class="cl-sub" data-i18n="cl.sub">Pack your plan to 100%</div>
      </div>
    </div>
    <div class="cl-items" id="clItems"></div>
    <p class="cl-desc" data-i18n="cl.desc">Checklist is a light guide — play in any order you like.</p>
    <div class="badge-ready" id="badgeReady">
      <div data-i18n="cl.ready">🎉 Board is ready to go!</div>
      <button class="btn coral sm" id="btnShowCard" data-i18n="cl.showCard">Show my trip card</button>
    </div>
  </aside>

  <main class="board" id="board">
    <div class="board-inner">
      <div class="board-title" id="boardTitle" contenteditable="true" data-ph="My class trip…"></div>
    </div>
    <div class="board-inner" id="cols"></div>
  </main>
</div>

<!-- 完成卡片 -->
<div class="veil" id="veilCard">
  <div class="paper-card" id="cardBody">
    <div class="ribbon">
      <svg width="120" height="26" viewBox="0 0 120 26"><rect x="2" y="2" width="116" height="16" fill="#ff7a59" rx="4"/><polygon points="2,18 10,26 18,18" fill="#e86240"/><polygon points="102,18 110,26 118,18" fill="#e86240"/></svg>
    </div>
    <h2 id="cardTitle" data-i18n="card.title">Your Trip Plan is Ready!</h2>
    <p class="sub" id="cardSub"></p>

const t = k => (I18N[state && state.lang || "zh-TW"] && I18N[state.lang][k]) ?? I18N["zh-TW"][k] ?? k;

/* ================= 狀態 ================= */
const LS_KEY = "trip-planner.v1";
let state = null;
const COLORS = ["#58a8a0","#c96f6a","#b68ad0","#6aa8d6","#e39a3a","#7fb57f","#e07a8f","#8b8fd0"];

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
const find = (sec, id) => state[sec].find(c => c.id === id);

function defaultState(){
  return {
    lang: detectLang(),
    title: "",
    members: [],
    attractions: [], food: [], transport: [], tasks: [],
    budget: [], timeline: [],
    completed: false
  };
}
function detectLang(){
  const nav = (navigator.language || "zh-TW").toLowerCase();
  if(nav.startsWith("zh")) return nav.includes("tw") || nav.includes("hk") ? "zh-TW" : "zh-CN";
  return "en";
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ state = Object.assign(defaultState(), JSON.parse(raw)); return; }
  }catch(e){}
  state = defaultState();
}
function wipe(){
  const lang = state ? state.lang : $("#langSel").value;
  try{ localStorage.removeItem(LS_KEY); }catch(e){}
  state = defaultState();
  state.lang = lang || detectLang();
}

/* ================= DOM helpers ================= */
const $ = s => document.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if(cls) e.className = cls; if(html!=null) e.innerHTML = html; return e; };

/* ================= 晴天確認 ================= */
function bindStatic(){
  document.querySelectorAll("[data-i18n]").forEach(n => n.textContent = t(n.dataset.i18n));
  $("#langSel").value = state.lang;
}
function applyLang(){
  state.lang = $("#langSel").value; save();
  document.documentElement.lang = state.lang;
  bindStatic(); renderAll();
  if($("#veilHelp").classList.contains("open")) renderHelp();
}

/* ================= 檢核清單 ================= */
function checklist(){
  const ok = [
    state.attractions.length >= 3,
    state.food.length >= 2,
    state.transport.length >= 1,
    state.tasks.length >= 3 && state.tasks.every(x => !!x.assigneeId),
    state.budget.filter(Boolean).filter(x => x.amount > 0).length >= 3,
    state.timeline.filter(Boolean).filter(x => x.text.trim() !== "").length >= 3
  ];
  return ok;
}
const CIRC = 2 * Math.PI * 31;
function renderChecklist(){
  const ok = checklist(); const n = ok.filter(Boolean).length; const p = Math.round(n/6*100);
  $("#ringNum").textContent = p + "%";
  document.querySelectorAll(".ring .fg").forEach(c => {
    c.style.strokeDasharray = CIRC + "px";
    c.style.strokeDashoffset = CIRC * (1 - p/100) + "px";
  });
  const wrap = $("#clItems"); wrap.innerHTML = "";
  [1,2,3,4,5,6].forEach(i => {
    const d = el("div", "cl-item" + (ok[i-1] ? " done" : ""));
    d.appendChild(el("div","cl-check","✓"));
    d.appendChild(el("span", null, t("cl.i"+i)));
    wrap.appendChild(d);
  });
  const ready = $("#badgeReady");
  const all = n === 6;
  ready.classList.toggle("show", all);
  if(all && !state.completed){ state.completed = true; save(); setTimeout(spawnCelebration, 350); }
}

function buildColumn(m){
  const col = el("div","col");
  const head = el("div","col-head");
  head.appendChild(el("div","was"));
  const ic = el("div","ic "+m.colIc);
  ic.innerHTML = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICONS[m.icon]+'</svg>';
  head.appendChild(ic);
  const nameKey = {attractions:"att", food:"food", transport:"trans", tasks:"tasks", budget:"budget", timeline:"time"}[m.key];
  head.appendChild(el("h2",null,t("col."+nameKey)));
  head.appendChild(el("span","count", String(state[m.key].length)));
  const labelKey = {attractions:"att", food:"food", transport:"trans", tasks:"task", budget:"budget", timeline:"slot"}[m.key];
  const addBtn = el("button","col-add","+");
  addBtn.title = t("add."+labelKey);
  addBtn.setAttribute("aria-label", t("add."+labelKey));
  addBtn.dataset.action = "add"; addBtn.dataset.sec = m.key;
  head.appendChild(addBtn);
  const body = el("div","col-body");
  if(m.key==="tasks") body.appendChild(buildTasksBody());
  else if(m.key==="budget") body.appendChild(buildBudgetBody());
  else if(m.key==="timeline") body.appendChild(buildTimelineBody());
  else buildSimpleCol(m, body);
  col.appendChild(head); col.appendChild(body);
  return col;
}

function buildSimpleCol(m, body){
  state[m.key].forEach(c => body.appendChild(buildCard(m.key, c)));
}
function scheduledIds(){
  return new Set(state.timeline.filter(x => x.refId).map(x => x.refId));
}
function buildCard(sec, c){
  const scheduled = sec === "attractions" && scheduledIds().has(c.id);
  const note = el("div","note note-"+kindOf(sec));
  note.draggable = true;
  note.dataset.drag = JSON.stringify({mode:"card", sec, id:c.id});
  const nt = el("div","nt"); nt.contentEditable = "true";
  nt.dataset.sec = sec; nt.dataset.id = c.id; nt.textContent = c.text || "";
  const feet = el("div","note-foot");
  if(sec==="attractions"){
    const h = el("button","heart","♥ "+c.likes); h.dataset.action="heart"; h.dataset.id=c.id;
    feet.appendChild(h);
  }
  if(sec==="food" && c.price){
    const b = el("span","mini", c.price); feet.appendChild(b);
  }
  if(sec==="transport"){
    if(c.cost){ const b = el("span","badge", c.cost); b.style.background="#e39a3a"; feet.appendChild(b); }
    if(c.time){ const b = el("span","badge", c.time+" "+t("minicap")); b.style.background="#58a8a0"; feet.appendChild(b); }
  }
  if(scheduled){ feet.appendChild(el("span","seal", t("t.note"))); }
  const del = el("button","del","✕"); del.dataset.action="del"; del.dataset.sec=sec; del.dataset.id=c.id;
  feet.appendChild(del);
  note.appendChild(nt); note.appendChild(feet);
  note.addEventListener("dragstart", onDragStart);
  note.addEventListener("dragend", onDragEnd);
  return note;
}
function kindOf(sec){
  return {attractions:"o", food:"p", transport:"s", tasks:"m", budget:"v", timeline:"y"}[sec] || "y";
}

function buildBudgetBody(){

    const row = el("div","budget-row");
    const lab = el("input"); lab.type="text"; lab.value = c.label || ""; lab.placeholder = t("ph.budgetLabel");

    wrap.appendChild(row);
  });
  const sum = el("div","budget-sum");

  const cur = (state.lang==="en") ? "$" : "HK$";
  const fmt = n => n.toLocaleString(state.lang==="en"?"en-US":"zh-HK", {maximumFractionDigits:0});
  sum.innerHTML =
    '<div class="l">'+t("t.total")+'</div><div class="big">'+cur+fmt(total)+'</div>'+
    '<div class="per">'+t("t.full")+' ≈ '+cur+fmt(per)+' · '+state.members.length+' '+t("t.members")+'</div>';

function addCard(sec){
  if(sec==="tasks") state.tasks.push({id:uid(), text:"", assigneeId:null});
  else if(sec==="budget") state.budget.push({id:uid(), label:"", amount:0});
  else if(sec==="timeline") state.timeline.push({id:uid(), time:"", text:"", refId:null});
  else state[sec].push({id:uid(), text:"", likes:0, price:"", cost:"", time:""});
  save(); renderAll();
}
function delCard(sec, id){
  state[sec] = state[sec].filter(x => x.id !== id);
  save(); renderAll();
}
function delMember(id){
  state.members = state.members.filter(x=>x.id!==id);
  state.tasks.forEach(tsk => { if(tsk.assigneeId===id) tsk.assigneeId=null; });
  save(); renderAll();
}
function unassign(id){ const c = find("tasks", id); if(c) c.assigneeId = null; save(); renderAll(); }
function delSlot(id){ state.timeline = state.timeline.filter(x=>x.id!==id); save(); renderAll(); }

/* ================= 拖曳 ================= */
let drag = null;
function onDragStart(e){
  drag = JSON.parse(e.target.dataset.drag);
  drag.text = e.target.querySelector(".nt") ? e.target.querySelector(".nt").textContent : "";
  try{ e.dataTransfer.setData("text/plain", drag.mode); e.dataTransfer.effectAllowed = "move"; }catch(err){}
  e.target.classList.add("dragging");
}
function onDragEnd(e){ if(e.target) e.target.classList.remove("dragging"); drag=null; }
function onDragOver(e){
  if(!drag) return;
  e.preventDefault();
  const zone = e.target.closest("[data-drop]");
  if(zone){
    const can = (zone.dataset.drop==="member" && drag.mode==="member") || (zone.dataset.drop==="slot" && drag.mode==="card");
    if(can) zone.classList.add("drag-over");
  }
}
function onDragLeave(e){ const z = e.target.closest("[data-drop]"); if(z) z.classList.remove("drag-over"); }
function onDropMember(e){
  if(!drag) return;
  const zone = e.target.closest("[data-drop='member']");
  if(!zone || drag.mode!=="member") return;
  e.preventDefault(); zone.classList.remove("drag-over");
  const tsk = zone; // task card
  const id = tsk.querySelector(".nt").dataset.id;
  const c = find("tasks", id); if(c) c.assigneeId = drag.id;
  save(); renderAll();
}
function onDropSlot(e){
  if(!drag) return;
  const zone = e.target.closest("[data-drop='slot']");
  if(!zone || drag.mode!=="card") return;
  e.preventDefault(); zone.classList.remove("drag-over");
  const s = state.timeline.find(x=>x.id===zone.dataset.id);
  if(!s) return;
  const src = find(drag.sec, drag.id);
  s.text = src ? src.text : drag.text; s.refId = drag.id;
  drag = null;
  save(); renderAll();
}

/* ================= 事件綁定 ================= */
function bind(){
  $("#langSel").addEventListener("change", applyLang);

  $("#btnExample").addEventListener("click", loadExample);
  $("#btnReset").addEventListener("click", ()=>{
    showConfirm(t("resetMsg"), ()=>{ wipe(); bindStatic(); $("#board").scrollLeft = 0; renderAll(); });
  });
  $("#btnShowCard").addEventListener("click", openCard);
  $("#btnAgain").addEventListener("click", ()=>{
    $("#veilCard").classList.remove("open");
    showConfirm(t("resetMsg"), ()=>{ wipe(); bindStatic(); $("#board").scrollLeft = 0; renderAll(); });
  });
  $("#btnCloseCard").addEventListener("click", ()=>$("#veilCard").classList.remove("open"));
  $("#btnHelp").addEventListener("click", ()=>{ renderHelp(); $("#veilHelp").classList.add("open"); });
  $("#veilCard").addEventListener("click", e=>{ if(e.target.id==="veilCard") e.target.classList.remove("open"); });
  $("#veilHelp").addEventListener("click", e=>{ if(e.target.id==="veilHelp") e.target.classList.remove("open"); });
  $("#cfYes").addEventListener("click", ()=>{ const cb = cfCb; closeConfirm(); if(cb) cb(); });
  $("#cfNo").addEventListener("click", closeConfirm);
  $("#veilConfirm").addEventListener("click", e=>{ if(e.target.id==="veilConfirm") closeConfirm(); });

  $("#boardTitle").addEventListener("input", e=>{ state.title = e.target.textContent; save(); });

  // 欄位內互動（點擊）
  $("#cols").addEventListener("click", e=>{
    const a = e.target.closest("[data-action]");
    if(!a) return;
    const act = a.dataset.action;
    if(act==="add"){ addCard(a.dataset.sec); }
    else if(act==="del"){ delCard(a.dataset.sec, a.dataset.id, false); }
    else if(act==="heart"){ const c = find("attractions", a.dataset.id); if(c){ c.likes = (c.likes||0)+1; save(); renderAll(); } }
    else if(act==="delMem"){ delMember(a.dataset.id); }
    else if(act==="unassign"){ unassign(a.dataset.id); }
    else if(act==="delSlot"){ delSlot(a.dataset.id); }
  });

  // 內容編輯（contenteditable / 輸入框）
  $("#cols").addEventListener("input", e=>{
    const elTarget = e.target;
    if(elTarget.matches(".nt")){
      const c = find(elTarget.dataset.sec, elTarget.dataset.id); if(c){ c.text = elTarget.textContent; save(); }
    }else if(elTarget.matches(".tl-time")){
      const s = state.timeline.find(x=>x.id===elTarget.dataset.id); if(s){ s.time = elTarget.value; save(); }
    }else if(elTarget.matches(".tl-text")){
      const s = state.timeline.find(x=>x.id===elTarget.dataset.id); if(s){ s.text = elTarget.textContent; save(); renderChecklist(); }
    }else if(elTarget.matches("input[data-f]")){
      const c = find("budget", elTarget.dataset.id); if(c){
        if(elTarget.dataset.f==="label") c.label = elTarget.value;
        else c.amount = parseFloat(elTarget.value) || 0;
        save(); renderChecklist();
        // 只重繪總計，避免輸入失去焦點
        const sumEl = $("#cols .budget-sum");
        if(elTarget.dataset.f==="amount" && sumEl){
          const total = state.budget.reduce((a,b)=>a+(+b.amount||0),0);
          const members = Math.max(1, state.members.length);
          const cur = state.lang==="en" ? "$" : "HK$";
          const fmt = n => n.toLocaleString(state.lang==="en"?"en-US":"zh-HK", {maximumFractionDigits:0});
          sumEl.querySelector(".big").textContent = cur+fmt(total);
          sumEl.querySelector(".per").textContent = t("t.full")+" ≈ "+cur+fmt(total/members)+" · "+state.members.length+" "+t("t.members");
        }
      }
    }
  });

  // 成員新增
  const addMemberBtn = document.querySelector("#cols");
  addMemberBtn.addEventListener("click", e=>{
    if(e.target.classList.contains("btn") && e.target.textContent.trim()===t("add.member")){
      const row = e.target.closest(".addrow"); const inp = row.querySelector("input");
      const name = inp.value.trim();
      if(name){ state.members.push({id:uid(), name, color:COLORS[state.members.length % COLORS.length]}); save(); renderAll(); }
    }
  });
}

/* ================= 啟動 ================= */
load();
document.documentElement.lang = state.lang;
bindStatic();
renderAll();
bind();
</script>
</body>
</html>
